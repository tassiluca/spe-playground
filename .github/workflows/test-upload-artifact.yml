name: Test upload artifact

on:
  workflow_call: 

jobs:
  Upload-Artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Create a file
        run: echo "This is a test file - ${{ github.sha }}" > test.txt
      - name: Print workflow name
        run: echo "GitHub workflow ${{ github.workflow_ref }}"
      - name: Print workflow sha
        run: echo "GitHub sha ${{ github.sha }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-artifact
          path: ./*.txt
          if-no-files-found: error
